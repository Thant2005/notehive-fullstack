<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>NoteHive icon</title>
  <desc>NoteHive rounded square icon in deep purple with white note lines</desc>

  <defs>
    <radialGradient id="purpleGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#6D28D9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="50" ry="50" fill="url(#purpleGrad)" filter="url(#glow)"/>
  <rect x="0" y="0" width="200" height="110" rx="50" ry="50" fill="white" opacity="0.07"/>

  <rect x="44" y="72" width="112" height="13" rx="6.5" fill="white" opacity="0.95"/>
  <rect x="44" y="95" width="112" height="13" rx="6.5" fill="white" opacity="0.95"/>
  <rect x="44" y="118" width="78" height="13" rx="6.5" fill="white" opacity="0.95"/>

  <circle cx="152" cy="50" r="20" fill="#DDD6FE" opacity="0.9"/>
  <text x="152" y="57" text-anchor="middle" font-size="18" font-family="system-ui,sans-serif">🐝</text>
</svg>
